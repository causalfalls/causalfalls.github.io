<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 210" width="210" height="210">
  <defs>
    <!-- Cyan Arrow Marker for Node 2 -> Node 1 -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00F0FF" />
    </marker>
    <!-- Magenta Arrow Marker for Node 3 -> Node 2 -->
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B026FF" />
    </marker>
    <!-- Amber Arrow Marker for Node 1 -> Node 3 -->
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FFB800" />
    </marker>

    <!-- Subtle gradient for dark background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B14" />
    </radialGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="210" height="210" rx="42" fill="url(#bgGrad)" />

  <!-- Directed Causal Edges with Arrowheads -->
  <!-- Edge from Node 2 (155, 52) to Node 1 (45, 97) -->
  <path d="M 131.88 61.97 C 68.36 86.35 68.36 86.35 68.36 86.35"
        fill="none" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" marker-start="url(#arrow-cyan)" />

  <!-- Edge from Node 3 (138, 162) to Node 2 (155, 52) -->
  <path d="M 143.77 136.74 L 153.05 78.25"
        fill="none" stroke="#B026FF" stroke-width="8" stroke-linecap="round" marker-start="url(#arrow-purple)" />

  <!-- Edge from Node 3 (138, 162) to Node 1 (45, 97) -->
  <path d="M 114.73 149.81 L 62.42 115.04"
        fill="none" stroke="#FFB800" stroke-width="8" stroke-linecap="round" marker-start="url(#arrow-amber)" />

  <!-- Node 1 (Left) -->
  <circle cx="45.4" cy="96.9" r="25.2" fill="#0D1529" stroke="#00F0FF" stroke-width="9" />

  <!-- Node 2 (Top Right) -->
  <circle cx="155.1" cy="52.0" r="25.2" fill="#0D1529" stroke="#B026FF" stroke-width="9" />

  <!-- Node 3 (Bottom Right) -->
  <circle cx="138.7" cy="162.5" r="25.2" fill="#0D1529" stroke="#FFB800" stroke-width="9" />
</svg>
